services:
  postgres:
    image: postgres:16-alpine
    container_name: revenue-recovery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: revenue_recovery
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker-init:/docker-entrypoint-initdb.d   # auto-applies SQL files on first container start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: revenue-recovery-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ingestion:
    build:
      context: ./services/ingestion
    container_name: revenue-recovery-ingestion
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/revenue_recovery?sslmode=disable
      REDIS_URL: redis://redis:6379
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  decision-engine:
    build:
      context: ./services/decision-engine
    container_name: revenue-recovery-decision-engine
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/revenue_recovery?sslmode=disable
      REDIS_URL: redis://redis:6379
      LLM_ORCHESTRATOR_URL: http://llm-orchestrator:8080
      EXECUTION_URL: http://execution:8080
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  execution:
    build:
      context: ./services/execution
    container_name: revenue-recovery-execution
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/revenue_recovery?sslmode=disable
      LLM_ORCHESTRATOR_URL: http://llm-orchestrator:8080
      DECISION_ENGINE_URL: http://decision-engine:8080
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy

  llm-orchestrator:
    build:
      context: ./services/llm-orchestrator
    container_name: revenue-recovery-llm-orchestrator
    restart: unless-stopped
    env_file: .env
    ports:
      - "8084:8080"

  dashboard:
    build:
      context: ./services/dashboard
    container_name: revenue-recovery-dashboard
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/revenue_recovery?sslmode=disable
      DECISION_ENGINE_URL: http://decision-engine:8080
      EXECUTION_URL: http://execution:8080
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data: